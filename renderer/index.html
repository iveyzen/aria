<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Aria</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="win-controls">
    <button id="min-btn" class="wbtn" title="Minimize">─</button>
    <button id="close-btn" class="wbtn close" title="Close">✕</button>
  </div>

  <main>
    <canvas id="orb" title="Click to connect / disconnect"></canvas>
    <div id="status">Offline</div>
    <div id="aria-line"></div>
  </main>

  <footer class="dock">
    <button id="mic-btn" class="dock-btn" title="Microphone">
      <svg viewBox="0 0 24 24">
        <rect x="9" y="3" width="6" height="11" rx="3" />
        <path d="M5 11a7 7 0 0 0 14 0" />
        <line x1="12" y1="18" x2="12" y2="21" />
        <line class="slash" x1="4" y1="4" x2="20" y2="20" />
      </svg>
    </button>
    <button id="watch-btn" class="dock-btn" title="Vision: pick the screen or window she watches">
      <svg viewBox="0 0 24 24">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" />
        <circle cx="12" cy="12" r="2.6" />
      </svg>
    </button>
    <button id="settings-btn" class="dock-btn" title="Settings">
      <svg viewBox="0 0 24 24">
        <line x1="4" y1="7" x2="20" y2="7" />
        <circle class="knob" cx="10" cy="7" r="2.2" />
        <line x1="4" y1="12" x2="20" y2="12" />
        <circle class="knob" cx="15" cy="12" r="2.2" />
        <line x1="4" y1="17" x2="20" y2="17" />
        <circle class="knob" cx="7.5" cy="17" r="2.2" />
      </svg>
    </button>
  </footer>

  <div id="picker" class="overlay hidden">
    <h2>WHAT ARIA WATCHES</h2>
    <p class="picker-hint">Pick a screen or a window. She'll keep an eye on it while you play or watch.</p>
    <div id="picker-list"></div>
    <div class="overlay-actions">
      <button id="picker-off" class="txt-btn muted">Not right now</button>
      <button id="picker-close" class="txt-btn">Close</button>
    </div>
  </div>

  <div id="settings" class="overlay hidden">
    <h2>Settings</h2>

    <section>
      <div class="sec-label">Connection</div>
      <input id="cfg-apikey" type="password" placeholder="OpenAI API key (sk-…)"
             autocomplete="off" spellcheck="false" />
    </section>

    <section>
      <div class="sec-label">How much she talks</div>
      <div id="proactivity-grid">
        <button class="level" data-level="quiet">Quiet</button>
        <button class="level" data-level="balanced">Balanced</button>
        <button class="level" data-level="chatty">Chatty</button>
      </div>
      <p class="level-hint" id="level-hint"></p>
    </section>

    <section>
      <div class="sec-label">Interface</div>
      <label class="switch-row">
        <span>Show her subtitles</span>
        <span class="switch"><input id="cfg-captions" type="checkbox" /><i></i></span>
      </label>
      <label class="switch-row">
        <span>Keep window on top</span>
        <span class="switch"><input id="cfg-ontop" type="checkbox" /><i></i></span>
      </label>
    </section>

    <div class="overlay-actions">
      <button id="cfg-save" class="txt-btn accent">Save</button>
      <button id="cfg-close" class="txt-btn">Close</button>
    </div>
  </div>

  <script src="sounds.js"></script>
  <script src="orb.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
